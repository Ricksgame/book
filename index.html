<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=0.1, maximum-scale=4, user-scalable=yes">

<title>本貸出システム</title>

<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

<style>

body {
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    font-size: 24px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.section {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

select,
button {
    font-size: 18px;
    padding: 10px;
}

button {
    cursor: pointer;
}

#preview {
    max-width: 100%;
    height: auto;
}

#status {
    margin-top: 10px;
    padding: 10px;
    background: #eee;
    border-radius: 5px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.cart-title {
    font-weight: bold;
}

.cart-jan {
    font-size: 13px;
    color: #666;
}

.delete-button {
    font-size: 14px;
    padding: 5px 8px;
}

#actionButtons {
    display: flex;
    gap: 10px;
}

#actionButtons button {
    flex: 1;
    border: none;
    border-radius: 5px;
}

#lendModeButton {
    background: #333;
    color: white;
}

#returnModeButton {
    background: #aaa;
    color: white;
}

#lendButton,
#returnButton {
    width: 100%;
    margin-top: 15px;
    color: white;
    border: none;
    border-radius: 5px;
}

#lendButton {
    background: #333;
}

#returnButton {
    background: #277a3d;
}

#lendButton:disabled,
#returnButton:disabled {
    background: #aaa;
}

#cameraArea {
    text-align: center;
}

#jan {
    width: 100%;
    box-sizing: border-box;
}

.hidden {
    display: none;
}

</style>

</head>


<body>

<div class="container">

<h1>📚 図書館貸出システム</h1>


<div class="section">

<h2>操作</h2>

<div id="actionButtons">

<button id="lendModeButton">
📕 貸出
</button>

<button id="returnModeButton">
📗 返却
</button>

</div>

</div>


<div class="section" id="userSection">

<h2>ユーザー</h2>

<select id="userSelect">

<option value="">
ユーザーを選択してください
</option>

</select>

</div>


<div class="section">

<h2 id="scanTitle">📷 本を追加</h2>

<div id="cameraArea">

<canvas id="preview"></canvas>

</div>

<div id="status">
ユーザーを選択してください
</div>

</div>


<div class="section">

<h2 id="cartTitle">🛒 貸出カート</h2>

<div id="cart">
カートは空です
</div>

<button id="lendButton" disabled>
貸し出す
</button>

<button id="returnButton" disabled class="hidden">
返却する
</button>

</div>


<div class="section">

<h2>読み取り履歴</h2>

<textarea id="jan"
          rows="5"
          readonly></textarea>

</div>


</div>


<script>


const GAS_URL = "https://script.google.com/macros/s/AKfycbyGENey-Lzs-00892pPg2p5fAnCI7Vo32b8aXxV5xg-kIjfiqo5rFKNRUDOmg74-WgX/exec";


let cart = [];

let selectedUser = "";

let currentMode = "lend";


let DetectedCount = 0;

let DetectedCode = "";


let video;

let prev;

let prev_ctx;

let tmp;

let tmp_ctx;

let jan;

let w;

let h;

let mw;

let mh;

let x1;

let y1;



/* =========================
   初期化
========================= */

window.addEventListener("load", function() {

    video = document.createElement("video");

    video.setAttribute("autoplay", "");
    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");

    video.onloadedmetadata = function() {
        video.play();
    };


    prev = document.getElementById("preview");

    prev_ctx = prev.getContext(
        "2d",
        { willReadFrequently: true }
    );


    tmp = document.createElement("canvas");

    tmp_ctx = tmp.getContext(
        "2d",
        { willReadFrequently: true }
    );


    jan = document.getElementById("jan");


    loadUsers();

    startCamera();

    updateMode();

});



/* =========================
   ユーザー取得
========================= */

function loadUsers() {

    fetch(GAS_URL + "?action=getUsers")

        .then(response => response.json())

        .then(users => {

            const select =
                document.getElementById("userSelect");


            users.forEach(user => {

                const option =
                    document.createElement("option");

                option.value = user;

                option.textContent = user;

                select.appendChild(option);

            });

        })

        .catch(error => {

            console.error(error);

            setStatus(
                "ユーザー情報を取得できませんでした"
            );

        });

}



/* =========================
   ユーザー選択
========================= */

document
    .getElementById("userSelect")
    .addEventListener("change", function() {

        selectedUser = this.value;


        if (currentMode !== "lend") {
            return;
        }


        if (selectedUser === "") {

            setStatus(
                "ユーザーを選択してください"
            );

        } else {

            setStatus(
                selectedUser +
                " さんが選択されています"
            );

        }

    });



/* =========================
   モード切り替え
========================= */

document
    .getElementById("lendModeButton")
    .addEventListener("click", function() {

        currentMode = "lend";

        cart = [];

        renderCart();

        updateMode();

    });



document
    .getElementById("returnModeButton")
    .addEventListener("click", function() {

        currentMode = "return";

        cart = [];

        renderCart();

        updateMode();

    });



function updateMode() {

    const userSection =
        document.getElementById("userSection");

    const lendModeButton =
        document.getElementById("lendModeButton");

    const returnModeButton =
        document.getElementById("returnModeButton");

    const scanTitle =
        document.getElementById("scanTitle");

    const cartTitle =
        document.getElementById("cartTitle");

    const lendButton =
        document.getElementById("lendButton");

    const returnButton =
        document.getElementById("returnButton");


    if (currentMode === "lend") {

        userSection.classList.remove("hidden");

        scanTitle.textContent =
            "📷 本を追加";

        cartTitle.textContent =
            "🛒 貸出カート";

        lendButton.classList.remove("hidden");

        returnButton.classList.add("hidden");

        lendModeButton.style.background =
            "#333";

        returnModeButton.style.background =
            "#aaa";


        if (selectedUser === "") {

            setStatus(
                "ユーザーを選択してください"
            );

        } else {

            setStatus(
                selectedUser +
                " さんが選択されています"
            );

        }

    } else {

        userSection.classList.add("hidden");

        scanTitle.textContent =
            "📷 返却する本を読み取り";

        cartTitle.textContent =
            "🛒 返却カート";

        lendButton.classList.add("hidden");

        returnButton.classList.remove("hidden");

        lendModeButton.style.background =
            "#aaa";

        returnModeButton.style.background =
            "#277a3d";


        setStatus(
            "返却する本のJANコードを読み取ってください"
        );

    }

}



/* =========================
   カメラ起動
========================= */

function startCamera() {

    navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

            facingMode: "environment",

            width: {
                ideal: 640
            },

            height: {
                ideal: 480
            }

        }

    })

    .then(function(stream) {

        video.srcObject = stream;

        setTimeout(
            function() {
                Scan(true);
            },
            500
        );

    })

    .catch(function(err) {

        console.error(err);

        setStatus(
            "カメラを使用できません: " +
            err.message
        );

    });

}



/* =========================
   スキャン
========================= */

function Scan(first) {

    if (first) {

        w = video.videoWidth;

        h = video.videoHeight;


        prev.style.width =
            (w / 2) + "px";

        prev.style.height =
            (h / 2) + "px";


        prev.setAttribute(
            "width",
            w
        );

        prev.setAttribute(
            "height",
            h
        );


        mw = w * 0.5;

        mh = w * 0.2;


        x1 = (w - mw) / 2;

        y1 = (h - mh) / 2;

    }


    prev_ctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );


    prev_ctx.beginPath();

    prev_ctx.strokeStyle =
        "rgb(255,0,0)";

    prev_ctx.lineWidth = 2;


    prev_ctx.rect(
        x1,
        y1,
        mw,
        mh
    );


    prev_ctx.stroke();


    tmp.setAttribute(
        "width",
        mw
    );

    tmp.setAttribute(
        "height",
        mh
    );


    tmp_ctx.drawImage(
        prev,
        x1,
        y1,
        mw,
        mh,
        0,
        0,
        mw,
        mh
    );


    tmp.toBlob(function(blob) {

        let reader =
            new FileReader();


        reader.onload = function() {

            let config = {

                decoder: {

                    readers: [
                        "ean_reader",
                        "ean_8_reader"
                    ],

                    multiple: false

                },


                locator: {

                    patchSize: "large",

                    halfSample: false

                },


                locate: false,

                src: reader.result

            };


            Quagga.decodeSingle(
                config,
                function() {}
            );

        };


        reader.readAsDataURL(blob);

    });


    setTimeout(
        function() {
            Scan(false);
        },
        50
    );

}



/* =========================
   JANコード検出
========================= */

Quagga.onDetected(function(result) {

    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {

        return;

    }


    const barcode =
        result.codeResult.code;


    /*
     * 3回連続で同じJANなら
     * 正式に読み取ったと判断
     */

    if (DetectedCode === barcode) {

        DetectedCount++;

    } else {

        DetectedCount = 1;

        DetectedCode = barcode;

    }


    if (DetectedCount >= 3) {

        DetectedCode = "";

        DetectedCount = 0;

        confirmBarcode(barcode);

    }

});



/* =========================
   JAN確定
========================= */

function confirmBarcode(barcode) {


    /*
     * 貸出モードでは
     * ユーザーが必要
     */

    if (
        currentMode === "lend" &&
        selectedUser === ""
    ) {

        setStatus(
            "先にユーザーを選択してください"
        );

        return;

    }


    /*
     * 読み取り履歴に表示
     */

    jan.value +=
        barcode + "\n";

    jan.scrollTop =
        jan.scrollHeight;



    /*
     * すでにカートにあるか確認
     */

    const alreadyInCart =
        cart.some(
            book => book.jan === barcode
        );


    if (alreadyInCart) {

        setStatus(
            "この本はすでにカートに入っています"
        );

        return;

    }


    setStatus(
        "本を確認しています..."
    );


    /*
     * GASから本の情報を取得
     */

    fetch(
        GAS_URL +
        "?action=getBooks"
    )

    .then(response =>
        response.json()
    )

    .then(books => {


        const book =
            books.find(
                book =>
                    book.jan === barcode
            );


        if (!book) {

            setStatus(
                "このJANコードの本は登録されていません"
            );

            return;

        }



        /*
         * 貸出モード
         */

        if (currentMode === "lend") {

            if (book.stock <= 0) {

                setStatus(
                    book.title +
                    " は在庫切れです"
                );

                return;

            }

        }



        /*
         * 返却モード
         *
         * 返却時は在庫数を確認せず、
         * 貸出履歴側で実際に貸出中か確認する
         */

        cart.push(book);


        renderCart();


        if (currentMode === "lend") {

            setStatus(
                "「" +
                book.title +
                "」を貸出カートに追加しました"
            );

        } else {

            setStatus(
                "「" +
                book.title +
                "」を返却カートに追加しました"
            );

        }

    })

    .catch(error => {

        console.error(error);

        setStatus(
            "本の情報を取得できませんでした"
        );

    });

}



/* =========================
   カート表示
========================= */

function renderCart() {

    const cartElement =
        document.getElementById("cart");


    const lendButton =
        document.getElementById("lendButton");


    const returnButton =
        document.getElementById("returnButton");


    if (cart.length === 0) {

        cartElement.textContent =
            "カートは空です";


        lendButton.disabled = true;

        returnButton.disabled = true;

        return;

    }


    cartElement.innerHTML = "";


    cart.forEach(function(book, index) {

        const item =
            document.createElement("div");


        item.className =
            "cart-item";


        const info =
            document.createElement("div");


        const title =
            document.createElement("div");


        title.className =
            "cart-title";


        title.textContent =
            book.title;


        const janText =
            document.createElement("div");


        janText.className =
            "cart-jan";


        janText.textContent =
            "JAN: " + book.jan;


        info.appendChild(title);

        info.appendChild(janText);


        const deleteButton =
            document.createElement("button");


        deleteButton.className =
            "delete-button";


        deleteButton.textContent =
            "削除";


        deleteButton.addEventListener(
            "click",
            function() {

                cart.splice(index, 1);

                renderCart();


                setStatus(
                    "カートから削除しました"
                );

            }
        );


        item.appendChild(info);

        item.appendChild(deleteButton);


        cartElement.appendChild(item);

    });


    if (currentMode === "lend") {

        lendButton.disabled = false;

    } else {

        returnButton.disabled = false;

    }

}



/* =========================
   貸し出し
========================= */

document
    .getElementById("lendButton")
    .addEventListener(
        "click",
        function() {


            if (selectedUser === "") {

                setStatus(
                    "ユーザーを選択してください"
                );

                return;

            }


            if (cart.length === 0) {

                setStatus(
                    "カートが空です"
                );

                return;

            }


            const lendButton =
                document.getElementById(
                    "lendButton"
                );


            lendButton.disabled = true;


            setStatus(
                "貸し出し処理中..."
            );


            /*
             * JANコードだけを送信
             */

            const books =
                cart.map(
                    book => book.jan
                );


            const params =
                new URLSearchParams();


            params.append(
                "action",
                "lend"
            );


            params.append(
                "user",
                selectedUser
            );


            params.append(
                "books",
                JSON.stringify(books)
            );


            fetch(
                GAS_URL +
                "?" +
                params.toString()
            )

            .then(response =>
                response.json()
            )

            .then(data => {

                if (data.success) {

                    alert(
                        "貸し出しが完了しました"
                    );


                    cart = [];

                    renderCart();


                    jan.value = "";


                    setStatus(
                        "貸し出し完了"
                    );

                } else {

                    alert(
                        data.message
                    );


                    lendButton.disabled =
                        false;

                }

            })

            .catch(error => {

                console.error(error);

                alert(
                    "貸し出し処理に失敗しました"
                );


                lendButton.disabled =
                    false;

            });

        }
    );



/* =========================
   返却
========================= */

document
    .getElementById("returnButton")
    .addEventListener(
        "click",
        async function() {


            if (cart.length === 0) {

                setStatus(
                    "返却カートが空です"
                );

                return;

            }


            const returnButton =
                document.getElementById(
                    "returnButton"
                );


            returnButton.disabled = true;


            setStatus(
                "返却処理中..."
            );


            try {

                for (const book of cart) {

                    const params =
                        new URLSearchParams();


                    params.append(
                        "action",
                        "return"
                    );


                    params.append(
                        "jan",
                        book.jan
                    );


                    const response =
                        await fetch(
                            GAS_URL +
                            "?" +
                            params.toString()
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        alert(
                            data.message
                        );

                        returnButton.disabled =
                            false;

                        setStatus(
                            "返却処理を確認してください"
                        );

                        return;

                    }

                }


                alert(
                    "返却が完了しました"
                );


                cart = [];

                renderCart();


                jan.value = "";


                setStatus(
                    "返却完了"
                );


            } catch (error) {

                console.error(error);

                alert(
                    "返却処理に失敗しました"
                );


                returnButton.disabled =
                    false;


                setStatus(
                    "返却処理に失敗しました"
                );

            }

        }
    );



/* =========================
   ステータス表示
========================= */

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent = message;

}

</script>

</body>

</html>
